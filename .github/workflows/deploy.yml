name: Build and Deploy React App
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build React app
        run: npm run build
        env:
          CI: false
      - name: Deploy to Nginx directory
        run: |
          sudo rm -rf /var/www/react-app/build
          sudo cp -r dist /var/www/react-app/build
      - name: Reload Nginx
        run: sudo systemctl reload nginx
